kind = "web"
previewPath = "/"
title = "SmritiSetu"
version = "1.0.0"
id = "artifacts/smriti-setu"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24045

[services.development]
run = "pnpm --filter @workspace/smriti-setu run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/smriti-setu", "run", "build" ]
publicDir = "artifacts/smriti-setu/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24045"
BASE_PATH = "/"
